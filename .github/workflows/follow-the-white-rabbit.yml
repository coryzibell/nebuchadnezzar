# follow the white rabbit.
# build binaries for release - following through to the end.
name: follow the white rabbit.

on:
  workflow_call:
    inputs:
      needs-openssl:
        description: 'Require OpenSSL for building'
        required: false
        type: boolean
        default: false
      extra-apt-packages:
        description: 'Additional apt packages (space-separated)'
        required: false
        type: string
        default: ''
      extra-brew-packages:
        description: 'Additional brew packages (space-separated)'
        required: false
        type: string
        default: ''
      extra-choco-packages:
        description: 'Additional chocolatey packages (space-separated)'
        required: false
        type: string
        default: ''
      exclude-targets:
        description: 'Targets to exclude (comma-separated, e.g., x86_64-unknown-linux-musl,aarch64-unknown-linux-musl)'
        required: false
        type: string
        default: ''
    secrets:
      GH_PAT:
        description: 'GitHub PAT for release creation'
        required: true

permissions:
  contents: write

jobs:
  get-name:
    name: Get Binary Name
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.get.outputs.name }}
    steps:
      - uses: actions/checkout@v6
      - name: Extract from Cargo.toml
        id: get
        run: |
          NAME=$(grep '^name = ' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: get-name
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken target must not cancel the other eight.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: ""
            cross: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            suffix: ""
          - os: ubuntu-latest
            target: x86_64-unknown-freebsd
            suffix: ""
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            suffix: ".exe"
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""

    env:
      BINARY_NAME: ${{ needs.get-name.outputs.name }}

    steps:
      - name: Check if target is excluded
        id: check
        shell: bash
        run: |
          EXCLUDED="${{ inputs.exclude-targets }}"
          TARGET="${{ matrix.target }}"
          if [[ ",$EXCLUDED," == *",$TARGET,"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Target $TARGET is excluded, skipping build"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.check.outputs.skip != 'true'

      - name: Install system dependencies
        if: steps.check.outputs.skip != 'true'
        uses: coryzibell/nebuchadnezzar/.github/actions/install-deps@main
        with:
          needs-openssl: ${{ inputs.needs-openssl }}
          extra-apt-packages: ${{ inputs.extra-apt-packages }}
          extra-brew-packages: ${{ inputs.extra-brew-packages }}
          extra-choco-packages: ${{ inputs.extra-choco-packages }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.skip != 'true'
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: steps.check.outputs.skip != 'true' && contains(matrix.target, 'musl') && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: steps.check.outputs.skip != 'true' && matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Determine lockfile mode
        if: steps.check.outputs.skip != 'true'
        id: lockfile
        shell: bash
        run: |
          # Build --locked when the consumer commits Cargo.lock so resolution
          # cannot float past pins ([patch.crates-io] etc.). Plain otherwise.
          # Deliberate v1 behavior change: lock-committing consumers now fail
          # loudly on Cargo.toml/Cargo.lock drift instead of silently floating
          # — that is the purpose. Release tags must carry a synced Cargo.lock.
          if [ -f Cargo.lock ]; then
            echo "flag=--locked" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "::warning title=No Cargo.lock committed::unlocked resolution — dependency drift possible"
          fi

      - name: Build with cargo
        if: steps.check.outputs.skip != 'true' && !matrix.cross
        run: cargo build --release ${{ steps.lockfile.outputs.flag }} --target ${{ matrix.target }}

      - name: Build with cross
        if: steps.check.outputs.skip != 'true' && matrix.cross
        run: cross build --release ${{ steps.lockfile.outputs.flag }} --target ${{ matrix.target }}

      - name: Determine asset name
        if: steps.check.outputs.skip != 'true'
        id: asset
        shell: bash
        run: |
          # Use full target triple for cargo-binstall compatibility
          echo "asset_name=${BINARY_NAME}-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - name: Package (Unix)
        if: steps.check.outputs.skip != 'true' && runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ${{ steps.asset.outputs.asset_name }}.tar.gz ${{ env.BINARY_NAME }}${{ matrix.suffix }}
          mv ${{ steps.asset.outputs.asset_name }}.tar.gz ../../..

      - name: Package (Windows)
        if: steps.check.outputs.skip != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}${{ matrix.suffix }} -DestinationPath ${{ steps.asset.outputs.asset_name }}.zip

      - name: Upload artifact (Unix)
        if: steps.check.outputs.skip != 'true' && runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.asset.outputs.asset_name }}
          path: ${{ steps.asset.outputs.asset_name }}.tar.gz

      - name: Upload artifact (Windows)
        if: steps.check.outputs.skip != 'true' && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.asset.outputs.asset_name }}
          path: ${{ steps.asset.outputs.asset_name }}.zip

  release:
    name: Create Release
    needs: [get-name, build]
    # Release whatever targets built — partial binaries beat none. Blocked
    # only by a get-name failure (no binary name, nothing usable) or by run
    # cancellation — a cancelled run must not publish a release.
    if: ${{ !cancelled() && needs.get-name.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: artifacts

      - name: Generate release notes
        env:
          BINARY_NAME: ${{ needs.get-name.outputs.name }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"

          cat > RELEASE_NOTES.md << 'EOF'
          ## Install

          ### From crates.io

          ```bash
          cargo install $BINARY_NAME
          ```

          ### Prebuilt Binaries

          | Platform | Architecture | Download |
          |----------|--------------|----------|
          EOF

          # Strip leading whitespace from heredoc
          sed -i 's/^          //' RELEASE_NOTES.md

          # Replace $BINARY_NAME placeholder
          sed -i "s/\$BINARY_NAME/$BINARY_NAME/g" RELEASE_NOTES.md

          # Generate table rows from artifacts (target triple naming)
          for file in artifacts/*/*.tar.gz artifacts/*/*.zip; do
            [ -f "$file" ] || continue
            FILENAME=$(basename "$file")
            URL="https://github.com/${REPO}/releases/download/${VERSION}/${FILENAME}"

            # Parse platform and arch from target triple (e.g., mx-x86_64-unknown-linux-gnu.tar.gz)
            case "$FILENAME" in
              *-x86_64-unknown-linux-gnu.*)    PLATFORM="Linux (glibc)"; ARCH="x86_64" ;;
              *-aarch64-unknown-linux-gnu.*)   PLATFORM="Linux (glibc)"; ARCH="aarch64" ;;
              *-x86_64-unknown-linux-musl.*)   PLATFORM="Linux (musl)"; ARCH="x86_64" ;;
              *-aarch64-unknown-linux-musl.*)  PLATFORM="Linux (musl)"; ARCH="aarch64" ;;
              *-x86_64-unknown-freebsd.*)      PLATFORM="FreeBSD"; ARCH="x86_64" ;;
              *-x86_64-pc-windows-msvc.*)      PLATFORM="Windows"; ARCH="x86_64" ;;
              *-aarch64-pc-windows-msvc.*)     PLATFORM="Windows"; ARCH="aarch64" ;;
              *-x86_64-apple-darwin.*)         PLATFORM="macOS"; ARCH="x86_64 (Intel)" ;;
              *-aarch64-apple-darwin.*)        PLATFORM="macOS"; ARCH="aarch64 (Apple Silicon)" ;;
              *) PLATFORM="Other"; ARCH="unknown" ;;
            esac

            echo "| $PLATFORM | $ARCH | [$FILENAME]($URL) |" >> RELEASE_NOTES.md
          done

          # Flag matrix targets that produced no artifact (failed legs).
          # Targets in exclude-targets are intentionally absent, not missing.
          # Keep this list in sync with the build matrix above.
          ALL_TARGETS="x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-unknown-freebsd x86_64-pc-windows-msvc aarch64-pc-windows-msvc x86_64-apple-darwin aarch64-apple-darwin"
          EXCLUDED="${{ inputs.exclude-targets }}"
          MISSING=""
          for TARGET in $ALL_TARGETS; do
            if [[ ",$EXCLUDED," == *",$TARGET,"* ]]; then
              continue
            fi
            if [ ! -d "artifacts/${BINARY_NAME}-${TARGET}" ]; then
              MISSING="${MISSING:+$MISSING, }$TARGET"
            fi
          done
          if [ -n "$MISSING" ]; then
            printf '\n> [!WARNING]\n> Partial release — missing targets: %s\n' "$MISSING" >> RELEASE_NOTES.md
            echo "::warning title=Partial release::missing targets: $MISSING"
          fi

      - name: Create Release
        env:
          # Use GH_PAT so release event triggers knock-knock workflow
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          VERSION="${GITHUB_REF_NAME}"

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION exists"
            exit 0
          fi

          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --notes-file RELEASE_NOTES.md

          for file in artifacts/*/*.tar.gz artifacts/*/*.zip; do
            [ -f "$file" ] || continue
            gh release upload "$VERSION" "$file"
          done
