# the matrix has you.
# tests, format checks, clippy - the simulation runs its checks.
name: the matrix has you.

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''
      needs-openssl:
        description: 'Require OpenSSL for building'
        required: false
        type: boolean
        default: false
      extra-apt-packages:
        description: 'Additional apt packages (space-separated)'
        required: false
        type: string
        default: ''
      extra-brew-packages:
        description: 'Additional brew packages (space-separated)'
        required: false
        type: string
        default: ''
      extra-choco-packages:
        description: 'Additional chocolatey packages (space-separated)'
        required: false
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-

      - name: Determine lockfile mode
        id: lockfile
        shell: bash
        run: |
          # Check --locked when the consumer commits Cargo.lock so resolution
          # cannot float past pins ([patch.crates-io] etc.). Plain otherwise.
          if [ -f Cargo.lock ]; then
            echo "flag=--locked" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "::warning title=No Cargo.lock committed::unlocked resolution — dependency drift possible"
          fi

      - run: cargo clippy --all-targets --all-features ${{ steps.lockfile.outputs.flag }} -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install system dependencies
        uses: coryzibell/nebuchadnezzar/.github/actions/install-deps@main
        with:
          needs-openssl: ${{ inputs.needs-openssl }}
          extra-apt-packages: ${{ inputs.extra-apt-packages }}
          extra-brew-packages: ${{ inputs.extra-brew-packages }}
          extra-choco-packages: ${{ inputs.extra-choco-packages }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-

      # HF Hub model artifacts (ONNX models/tokenizers pulled by tests via
      # hf-hub). Dedicated cache, not folded into the cargo cache: model
      # artifacts are static and must not invalidate on Cargo.lock changes.
      # Anonymous Hub downloads rate-limit (429); a hit avoids the network.
      # One path per OS (dirs::cache_dir + "huggingface"); the unmatched
      # paths are skipped. For consumers with no HF usage the save step
      # no-ops with a warning annotation — the job stays green.
      # Static key never refreshes on upstream revision bumps — evict the cache manually if the pinned model changes.
      - name: Cache HF models
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
            ~/Library/Caches/huggingface
            ~/AppData/Local/huggingface
          key: hf-models-${{ runner.os }}

      - name: Determine lockfile mode
        id: lockfile
        shell: bash
        run: |
          # Test --locked when the consumer commits Cargo.lock so resolution
          # cannot float past pins ([patch.crates-io] etc.). Plain otherwise.
          if [ -f Cargo.lock ]; then
            echo "flag=--locked" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "::warning title=No Cargo.lock committed::unlocked resolution — dependency drift possible"
          fi

      - run: cargo test ${{ steps.lockfile.outputs.flag }} --verbose
